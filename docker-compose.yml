services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud_detection"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      FRAUD_DATABASE_URL: postgresql+psycopg://fraud:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/fraud_detection
      FRAUD_MODEL_DIR: /app/artifacts/models
      FRAUD_DATASET_PATH: /app/data/raw/creditcard.csv
      FRAUD_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      FRAUD_ADMIN_API_KEY: ${FRAUD_ADMIN_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_URL: http://localhost:8000/api/v1}
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  postgres_data:
